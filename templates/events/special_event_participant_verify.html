{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ participant.full_name }}</title>
    <link rel="stylesheet" href="{% static 'css/special-event-participants.css' %}">
</head>
<body class="qr-verification-body">
    <main class="qr-minimal-record">
        <p><strong>Jina la Mtafiti:</strong> {{ participant.full_name }}</p>
        <p><strong>Taasisi:</strong> {{ participant.institution|default:"—" }}</p>
        <p><strong>Utafiti:</strong> {{ participant.research_title|default:"—" }}</p>
        <p><strong>Nyanja:</strong> {{ participant.research_field|default:"—" }}</p>
        <p class="qr-minimal-copyright">© MoEST 2026.</p>
    </main>
</body>
</html>
